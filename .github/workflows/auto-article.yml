name: Auto Article

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # secretは env 経由でのみ渡す。${{ }} でrun内に直接書くと、展開後の値が
      # ランナー上のシェルスクリプトに実体として書き込まれる。値に記号が
      # 含まれていればコマンドとして解釈される余地も残る。
      - name: Check for API key
        id: check-key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set — skipping article generation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate article
        if: steps.check-key.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node affiliate/generate-article.mjs

      # 生成物をcommitする前に必ず通す。捏造URL・誇大表現・成果保証などが
      # あればERRORで落ち、記事はpushされない。
      # これがないと、生成AIが作った誤りがそのまま自動公開される。
      - name: Lint generated article
        if: steps.check-key.outputs.skip == 'false'
        run: node affiliate/lint.mjs

      - name: Commit and push new article
        if: steps.check-key.outputs.skip == 'false'
        run: |
          git config user.name "affiliate-bot"
          git config user.email "bot@users.noreply.github.com"
          git add affiliate/content
          if git diff --cached --quiet; then
            echo "No new article to commit."
          else
            git commit -m "auto: 新規記事を自動生成"
            git push origin HEAD:main
          fi
